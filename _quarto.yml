project:
  type: website
  output-dir: docs

website:
  title: "AI and Data Science for Transport"
  repo-url: "https://github.com/itsleeds/ai4transport"
  repo-actions: [issue]
  announcement:
    icon: info-circle
    dismissable: true
    content: "This course is now complete. If you're interested in hiring us to deliver training or consultancy, get in touch with [Chris Rushton](https://environment.leeds.ac.uk/transport/staff/8835/dr-chris-rushton) and [Robin Lovelace](https://environment.leeds.ac.uk/transport/staff/953/professor-robin-lovelace)."
    type: primary
    position: below-navbar
  page-footer:
    right: "This page is built with [Quarto](https://quarto.org/)."
    left: "Materials by ITS Leeds, 2025-2026."
  sidebar:
    background: primary
    pinned: true
    align: center
    tools:
      - icon: github
        href: https://github.com/itsleeds/ai4transport
        text: GitHub
    style: docked
    contents:
      - href: index.qmd
        text: Home
      - href: schedule.qmd
        text: Schedule
      - href: prerequisites.qmd
        text: Prerequisites
      - section: "Day 1 Slides"
        contents:
          - href: slides/day1.html
            text: "Day 1 Slides"
      - section: "Day 1: Foundations & Tools"
        contents:
          - href: s1.qmd
            text: "Session 1: What is AI?"
          - href: s2.qmd
            text: "Session 2: How AI Works & 4D"
          - href: s3.qmd
            text: "Session 3: AI Tools & Copilot"
          - href: s4.qmd
            text: "Session 4: Coding Workshop"
      - section: "Day 2 Slides"
        contents:
          - href: slides/day2.html
            text: "Day 2 Slides"
      - section: "Day 2: Agentic AI & Applied Work"
        contents:
          - href: s5.qmd
            text: "Session 5: Superprompts to Agents"
          - href: s6.qmd
            text: "Session 6: AI-Driven Data Science"
          - href: s7.qmd
            text: "Session 7: Applied Projects"
          - href: s8.qmd
            text: "Session 8: Wrap-up"
      - section: "Extras"
        contents:
          - href: bonus.qmd
            text: "Bonus Exercises"
          - href: followup.qmd
            text: "Post-Course Follow-up"
          - href: survey.qmd
            text: "Survey Results"
      - href: https://github.com/itsleeds/ai4transport/issues
        text: Forum

format:
  html:
    theme: lux
    toc: true
    title-prefix: "AI and Data Science for Transport - "
    number-sections: true
    author-meta: "ITS Leeds"
    date-meta: "2025-2026"
    copyright: "© 2025-2026 ITS Leeds"
    license: "CC BY-SA"

execute:
  freeze: false
  cache: true
  message: false
  warning: false
